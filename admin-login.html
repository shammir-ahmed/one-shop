<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Shammir Ahmed Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f6f1e7;
            --maroon: #7a1c2b;
            --maroon-d: #57111d;
            --gold: #a97f24;
            --ink: #241610;
            --sans: 'Hind Siliguri', sans-serif;
            --serif: 'Noto Serif Bengali', serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: url('https://images.unsplash.com/photo-1610030469983-98e550d615ef?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
            font-family: var(--sans);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
        }
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(36,22,16,0.8), rgba(122,28,43,0.6));
            z-index: 1;
        }
        .login-card {
            background: rgba(246, 241, 231, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 3rem;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            z-index: 2;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            font-family: var(--serif);
            color: #fff;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .login-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        .input-group label {
            display: block;
            color: #fff;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        .input-group input {
            width: 100%;
            padding: 1rem;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-family: var(--sans);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 15px rgba(169, 127, 36, 0.3);
        }
        .login-btn {
            width: 100%;
            padding: 1rem;
            background: var(--gold);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            font-family: var(--sans);
        }
        .login-btn:hover {
            background: #bda25b;
            transform: translateY(-2px);
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="login-card">
        <div class="login-header">
            <h1>Admin Panel</h1>
            <p>Enter your credentials to manage the boutique.</p>
        </div>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" autocomplete="off" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <p class="error-msg" id="errorMsg">Invalid username or password.</p>
            <button type="submit" class="login-btn" style="margin-top: 1rem;">Log In</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            if(user === 'shammir' && pass === '1234@') {
                window.location.href = 'admin-dashboard.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
